name: Validate Financial Data

on:
  pull_request:
    paths:
      - 'update_rates.js'
      - 'update_inflation.js'
      - 'rates.json'
      - 'inflation.json'
      - 'schemas/**'
      - 'data_validation/**'
      - 'tests/data-validation/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/data-validation.yml'
      - '.github/workflows/rates.yml'
  push:
    branches: [main]
    paths:
      - 'rates.json'
      - 'inflation.json'
      - 'schemas/**'
      - 'data_validation/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Run data validation tests
        run: npm test

      - name: Validate publishable datasets
        run: npm run validate:data
