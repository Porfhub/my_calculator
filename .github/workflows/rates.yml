name: Update Mortgage Rates

on:
  schedule:
    - cron: '0 3 * * *' # 6:00 МСК
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: financial-data-update
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Run validation tests
        run: npm test

      - name: Run scripts to fetch financial data
        run: |
          node update_rates.js
          node update_inflation.js

      - name: Fail-closed publish gate
        run: npm run validate:data

      - name: Verify updater scope
        shell: bash
        run: |
          while IFS= read -r changed_file; do
            case "$changed_file" in
              rates.json|inflation.json) ;;
              *) echo "Unexpected updater change: $changed_file"; exit 1 ;;
            esac
          done < <(git diff --name-only)

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          if git diff --quiet -- rates.json inflation.json; then
            echo "No validated data changes to commit"
            exit 0
          fi
          git add rates.json inflation.json
          git diff --cached --check
          git commit -m "Автоматическое обновление официальных финансовых данных"
          git push

      - name: Alert when a safe degraded state was published
        if: always()
        run: node data_validation/validate.js --all --mode health
